# =====================================================
# CONFIGURACIÓN DEL PROYECTO
# =====================================================
spring.application.name=Sistema Almacén TecnoAndes
server.port=8080

# =====================================================
# CONFIGURACIÓN DE MYSQL
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_almacen_tecnoAndes?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TU_CONTRASEÑA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================================================
# CONFIGURACIÓN DE THYMELEAF
# =====================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# =====================================================
# CONFIGURACIÓN DE LOGS
# =====================================================
logging.level.org.springframework.security=DEBUG
logging.level.com.tecnoandes.almacen=DEBUG