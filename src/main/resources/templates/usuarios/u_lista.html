<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand"><i class="bi bi-box-seam"></i> TecnoAndes Perú S.A.C</a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/usuarios" class="active"><i class="bi bi-person-gear"></i> Usuarios</a>
    </div>

    <div class="main-content">
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-dark">Gestión de Usuarios</h4>
            <a href="/usuarios/nuevo" class="btn btn-primary" style="background-color: #7b2cbf; border: none;">
                <i class="bi bi-plus-circle"></i> Nuevo Usuario
            </a>
        </div>

        <div class="dashboard-panel">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nombre Completo</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.nombreCompleto}">Admin Demo</td>
                        <td th:text="${u.username}">admin</td>
                        <td th:text="${u.email}">admin@tecnoandes.com</td>
                        <!-- Muestra el primer rol asignado -->
                        <td th:text="${u.roles != null && !u.roles.isEmpty() ? u.roles.iterator().next().nombre : 'Sin Rol'}">ROLE_ADMIN</td>
                        <td>
                            <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                            <span th:if="${!u.activo}" class="badge bg-danger">Inactivo</span>
                        </td>
                        <td>
                            <a th:href="@{/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-primary" style="background-color: #f5af19; border: none;">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <!-- No permitir eliminar al usuario admin principal -->
                            <a th:if="${u.username != 'admin'}" th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar este usuario?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
