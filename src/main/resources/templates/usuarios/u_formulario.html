<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand"><i class="bi bi-box-seam"></i> TecnoAndes Perú S.A.C</a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/inventario/entradas"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
        <a href="/inventario/salidas"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
        <a href="/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex / Inventario</a>
        <a href="/reportes"><i class="bi bi-bar-chart"></i> Reportes</a>
        
        <!-- Solo para Admin -->
        <a href="/usuarios"><i class="bi bi-person-gear"></i> Usuarios</a>
    </div>

    <div class="main-content">
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-dark">Registrar / Editar Usuario</h4>
            <a href="/usuarios" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>

        <div class="dashboard-panel">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}" />
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" th:field="*{nombreCompleto}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" th:field="*{username}" class="form-control" required>
                    </div>
                    
                    <!-- Campo de contraseña (solo para nuevos) -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" th:required="${usuario.id == null}" placeholder="Dejar vacío para mantener actual">
                        <small class="text-muted" th:if="${usuario.id != null}">Si no desea cambiarla, deje el campo vacío.</small>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Rol del Sistema</label>
                        <select name="rolId" class="form-select" required>
                            <option value="">Seleccione un rol...</option>
                            <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nombre}"></option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" th:field="*{direccion}" class="form-control">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{activo}" id="activoCheck">
                            <label class="form-check-label" for="activoCheck">Usuario Activo</label>
                        </div>
                    </div>
                </div>

                <hr>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary" style="background-color: #7b2cbf; border: none;">
                        <i class="bi bi-save"></i> Guardar Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
