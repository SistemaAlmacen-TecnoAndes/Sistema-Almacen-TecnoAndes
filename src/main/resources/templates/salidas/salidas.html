<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salidas - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand"><i class="bi bi-box-seam"></i> TecnoAndes Perú S.A.C</a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/inventario/entradas"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
        <a href="/inventario/salidas"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
        <a href="/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex / Inventario</a>
        <a href="#"><i class="bi bi-bar-chart"></i> Reportes</a>
        
        <!-- Solo para Admin -->
        <a href="/usuarios"><i class="bi bi-person-gear"></i> Usuarios</a>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <h4 class="m-0 text-dark">Registro de Salidas (Despachos de Almacén)</h4>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="dashboard-panel mb-4">
            <h5>Registrar Nueva Salida (Restar Stock)</h5>
            <form th:action="@{/inventario/registrar}" method="post" class="row align-items-end">
                <input type="hidden" name="tipo" value="SALIDA">
                <div class="col-md-6 mb-2">
                    <label class="form-label">Producto</label>
                    <select name="productoId" class="form-select" required>
                        <option value="">Seleccione un producto...</option>
                        <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.codigo + ' - ' + p.nombre + ' (Stock: ' + p.stock + ')'}"></option>
                    </select>
                </div>
                <div class="col-md-3 mb-2">
                    <label class="form-label">Cantidad</label>
                    <input type="number" name="cantidad" class="form-control" min="1" required>
                </div>
                <div class="col-md-3 mb-2">
                    <button type="submit" class="btn btn-danger w-100">
                        <i class="bi bi-dash-circle"></i> Registrar Salida
                    </button>
                </div>
            </form>
        </div>

        <div class="dashboard-panel">
            <h5>Historial de Salidas</h5>
            <table class="table table-sm table-hover">
                <thead class="table-light"><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Stock Ant.</th><th>Stock Nuevo</th><th>Usuario</th></tr></thead>
                <tbody>
                    <tr th:each="m : ${movimientos}">
                        <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${m.producto.nombre}"></td>
                        <td th:text="${m.cantidad}"></td>
                        <td th:text="${m.stockAnterior}"></td>
                        <td th:text="${m.stockNuevo}"></td>
                        <td th:text="${m.usuario.username}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
