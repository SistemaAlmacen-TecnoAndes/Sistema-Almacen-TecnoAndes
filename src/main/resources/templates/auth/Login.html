<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | TecnoAndes Perú S.A.C.</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Imagen de fondo del almacén con capa azul */
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 58, 138, 0.75)), 
                url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Tarjeta de Login */
        .login-card {
            background-color: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        /* Botón con el morado de tu sistema */
        .btn-morado {
            background-color: #7b2cbf;
            color: white;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-morado:hover {
            background-color: #5a189a;
            color: white;
        }

        /* Estilo para los inputs */
        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 12px 15px;
        }

        .form-control:focus {
            border-color: #7b2cbf;
            box-shadow: 0 0 0 0.25rem rgba(123, 44, 191, 0.25);
        }

        .input-group-text {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-right: none;
            color: #6c757d;
        }

        /* Logo Texto */
        .logo-text {
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
        }

        .logo-text span {
            color: #7b2cbf;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo y Título -->
        <div class="text-center mb-4">
            <svg viewBox="0 0 120 124" fill="none" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 60px; margin-bottom: 10px;">
              <path d="M22 48L40 28L49 38" stroke="#7b2cbf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M98 48L80 28L71 38" stroke="#7b2cbf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M35 48L60 18L85 48L60 61L35 48Z" fill="#ffffff" stroke="#7b2cbf" stroke-width="5.5" stroke-linejoin="round"/>
              <path d="M60 18L51 43L60 61" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M60 61V98" stroke="#7b2cbf" stroke-width="5.5" stroke-linecap="round"/>
              <path d="M32 54L50 64V96L30 84V74L22 69" stroke="#7b2cbf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M41 68V83L26 74" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M88 54L70 64V96L90 84V74L98 69" stroke="#7b2cbf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M79 68V83L94 74" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="22" cy="54" r="5.5" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
              <circle cx="17" cy="68" r="5.5" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
              <circle cx="98" cy="54" r="5.5" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
              <circle cx="103" cy="68" r="5.5" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
              <circle cx="60" cy="108" r="5.5" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
            </svg>
            <h2 class="logo-text fs-3 mb-1">Tecno<span>Andes</span></h2>
            <p class="text-muted fw-bold mb-0" style="font-size: 0.75rem; letter-spacing: 2px;">PERÚ S.A.C.</p>
            <p class="text-muted" style="font-size: 0.85rem; margin-top: 5px;">Sistema de Gestión de Inventario</p>
        </div>

        <!-- Alertas de Spring Security -->
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center py-2 px-3" role="alert" style="font-size: 0.9rem;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center py-2 px-3" role="alert" style="font-size: 0.9rem;">
            <i class="bi bi-check-circle-fill me-2"></i>
            Has cerrado sesión correctamente.
        </div>

        <!-- Formulario -->
        <form th:action="@{/login}" method="post">
            
            <!-- Usuario -->
            <div class="mb-3">
                <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">USUARIO</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">
                <label class="form-label text-muted fw-bold" style="font-size: 0.8rem;">CONTRASEÑA</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.9rem;">
                        Recordarme
                    </label>
                </div>
                <a href="#" class="text-decoration-none fw-semibold" style="color: #7b2cbf; font-size: 0.9rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón -->
            <button type="submit" class="btn btn-morado w-100 py-2.5 rounded-3 fw-bold fs-6 shadow-sm">
                Iniciar Sesión <i class="bi bi-arrow-right ms-2"></i>
            </button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
