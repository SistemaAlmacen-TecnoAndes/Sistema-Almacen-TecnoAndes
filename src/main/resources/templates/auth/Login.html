<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - LogiStock WMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/Login.css}">
</head>
<body>

<div class="login-card text-center">
    <h2 class="mb-3" style="color: #7b2cbf;">LogiStock WMS</h2>
    <p class="text-muted mb-4">Sistema de Gestión de Almacén</p>

    <!-- Mensajes de error/éxito -->
    <div th:if="${param.error}" class="alert alert-danger p-2">Usuario o contraseña incorrectos</div>
    <div th:if="${param.logout}" class="alert alert-success p-2">Has cerrado sesión correctamente</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3 text-start">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Iniciar Sesión</button>
    </form>
</div>

</body>
</html>
