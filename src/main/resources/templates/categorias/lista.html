<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="sidebar">
        <a href="/dashboard" class="brand">
            <svg viewBox="0 0 120 124" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
              <path d="M22 48L40 28L49 38" stroke="#7b2cbf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M98 48L80 28L71 38" stroke="#7b2cbf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M35 48L60 18L85 48L60 61L35 48Z" fill="#181824" stroke="#7b2cbf" stroke-width="5.5" stroke-linejoin="round"/>
              <path d="M60 18L51 43L60 61" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M60 61V98" stroke="#7b2cbf" stroke-width="5.5" stroke-linecap="round"/>
              <path d="M32 54L50 64V96L30 84V74L22 69" stroke="#7b2cbf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M41 68V83L26 74" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M88 54L70 64V96L90 84V74L98 69" stroke="#7b2cbf" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M79 68V83L94 74" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="22" cy="54" r="5.5" fill="#181824" stroke="#22c55e" stroke-width="4"/>
              <circle cx="17" cy="68" r="5.5" fill="#181824" stroke="#22c55e" stroke-width="4"/>
              <circle cx="98" cy="54" r="5.5" fill="#181824" stroke="#22c55e" stroke-width="4"/>
              <circle cx="103" cy="68" r="5.5" fill="#181824" stroke="#22c55e" stroke-width="4"/>
              <circle cx="60" cy="108" r="5.5" fill="#181824" stroke="#22c55e" stroke-width="4"/>
            </svg>
            <span class="brand-title">Tecno<span>Andes</span></span>
            <span class="brand-ruc">PERÚ S.A.C.</span>
            <span class="brand-desc">Sistema de Gestión de Inventario</span>
        </a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias" class="active"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/inventario/entradas"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
        <a href="/inventario/salidas"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
        <a href="/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex / Inventario</a>
        <a href="/reportes"><i class="bi bi-bar-chart"></i> Reportes</a>
        
        <!-- Solo para Admin -->
        <a sec:authorize="hasRole('ADMIN')" href="/usuarios">
            <i class="bi bi-person-gear"></i> Usuarios
        </a>
        <a href="/configuracion" class="text-warning"><i class="bi bi-gear-fill"></i> Configuración</a>
    </div>

    <div class="main-content">
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-dark">Gestión de Categorías</h4>
            <a href="/categorias/nuevo" class="btn btn-primary" style="background-color: #7b2cbf; border: none;">
                <i class="bi bi-plus-circle"></i> Nueva Categoría
            </a>
        </div>

        <div class="dashboard-panel">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.id}">1</td>
                        <td th:text="${categoria.nombre}">Laptops</td>
                        <td th:text="${categoria.descripcion}">Descripción...</td>
                        <td>
                            <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-sm btn-primary" style="background-color: #f5af19; border: none;">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/categorias/eliminar/{id}(id=${categoria.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar esta categoría?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
