<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <div class="sidebar">
        <a href="/dashboard" class="brand"><i class="bi bi-box-seam"></i> TecnoAndés Perú S.A.C</a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos" class="active"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/inventario/entradas"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
        <a href="/inventario/salidas"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
        <a href="/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex / Inventario</a>
        <a href="/reportes"><i class="bi bi-bar-chart"></i> Reportes</a>
        <a href="/usuarios"><i class="bi bi-person-gear"></i> Usuarios</a>
    </div>

    <div class="main-content">
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-dark">Registrar Nuevo Producto</h4>
            <a href="/productos" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Volver a la lista
            </a>
        </div>

        <div class="dashboard-panel">
            <!-- Formulario conectado al controlador -->
            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
                
                <div class="row">
                    <!-- Código -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Código (SKU)</label>
                        <input type="text" th:field="*{codigo}" class="form-control" required placeholder="Ej: LAP-003">
                    </div>
                    
                    <!-- Nombre -->
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Nombre del Producto</label>
                        <input type="text" th:field="*{nombre}" class="form-control" required placeholder="Ej: Laptop Asus">
                    </div>
                </div>

                <div class="row">
                    <!-- Categoría -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Categoría</label>
                        <select th:field="*{categoria}" class="form-select" required>
                            <option value="">Seleccione una categoría...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                        </select>
                    </div>
                    
                    <!-- Descripción -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Detalles breves...">
                    </div>
                </div>

                <div class="row">
                    <!-- Precio Compra -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Precio Compra (S/)</label>
                        <input type="number" step="0.01" th:field="*{precioCompra}" class="form-control" required>
                    </div>
                    
                    <!-- Precio Venta -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Precio Venta (S/)</label>
                        <input type="number" step="0.01" th:field="*{precioVenta}" class="form-control" required>
                    </div>
                    
                    <!-- Stock -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Stock Inicial</label>
                        <input type="number" th:field="*{stock}" class="form-control" required value="0">
                    </div>

                    <!-- Stock Mínimo -->
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Stock Mínimo (Alerta)</label>
                        <input type="number" th:field="*{stockMinimo}" class="form-control" required value="5">
                    </div>
                </div>

                <hr>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary" style="background-color: #7b2cbf; border: none;">
                        <i class="bi bi-save"></i> Guardar Producto
                    </button>
                </div>
                <input type="hidden" th:field="*{id}" />
            </form>
        </div>
    </div>
</body>
</html>
