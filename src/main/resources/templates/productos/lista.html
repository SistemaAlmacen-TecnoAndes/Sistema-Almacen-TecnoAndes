<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - LogiStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Reutilizamos el CSS del dashboard para mantener el menú lateral -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <!-- Reutilizamos el menú lateral (en un proyecto real se usa un "fragmento", pero para ir rápido lo copiamos) -->
    <div class="sidebar">
        <a href="/dashboard" class="brand"><i class="bi bi-box-seam"></i> TecnoAndés Perú S.A.C</a>
        <a href="/dashboard"><i class="bi bi-grid-1x2-fill"></i> Dashboard</a>
        <a href="/productos" class="active"><i class="bi bi-box"></i> Productos</a>
        <a href="/categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="/proveedores"><i class="bi bi-truck"></i> Proveedores</a>
        <a href="/clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="/inventario/entradas"><i class="bi bi-arrow-down-circle"></i> Entradas</a>
        <a href="/inventario/salidas"><i class="bi bi-arrow-up-circle"></i> Salidas</a>
        <a href="/inventario/kardex"><i class="bi bi-journal-text"></i> Kardex / Inventario</a>
        <a href="#"><i class="bi bi-bar-chart"></i> Reportes</a>
        <a href="/usuarios"><i class="bi bi-person-gear"></i> Usuarios</a>
    </div>

    <div class="main-content">
        <!-- Barra superior -->
        <div class="top-navbar d-flex justify-content-between align-items-center">
            <h4 class="m-0 text-dark">Gestión de Productos</h4>
            <a href="/productos/nuevo" class="btn btn-primary" style="background-color: #7b2cbf; border: none;">
                <i class="bi bi-plus-circle"></i> Nuevo Producto
            </a>
        </div>

        <!-- Tabla de Productos -->
        <div class="dashboard-panel">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Precio Venta</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Thymeleaf itera sobre la lista de productos -->
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.codigo}">LAP-001</td>
                        <td th:text="${producto.nombre}">Laptop HP</td>
                        <td th:text="${producto.categoria.nombre}">Laptops</td>
                        <td th:text="${producto.stock}">10</td>
                        <td th:text="'S/ ' + ${producto.precioVenta}">S/ 2400.00</td>
                        <td>
                            <!-- Botón Editar -->
                            <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-sm btn-warning">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <!-- Botón Eliminar -->
                            <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que deseas eliminar este producto?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    <!-- Si la lista está vacía -->
                    <tr th:if="${#lists.isEmpty(productos)}">
                        <td colspan="6" class="text-center text-muted">No hay productos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
